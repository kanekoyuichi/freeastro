[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freeastro"
version = "0.2.0"
description = "A free, MIT-licensed Python astrology library for natal chart calculations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "skyfield>=1.46",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "kerykeion>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["freeastro"]
